[pytest]
norecursedirs = deprecated __pycache__ .venv venv .git migrations
asyncio_mode = auto
markers =
    integration: requires a live DATABASE_URL and all migrations applied
    slow: exhaustive searches (minutes); run with VIVI_RUN_SLOW=1, and in every gate run (VIVI_TEST_GATE=1)
    db: opens a database connection (A-10). Unmarked tests are PURE: the guard in tests/conftest.py fails any that connects. tests/api, tests/models, tests/services/erasure and every `integration` test are marked by directory.
